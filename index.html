<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Меню The Palms Beach Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: одна узкая колонка; сверху закреплённая панель (языки слева, тема справа); каждый раздел в своём пастельном цвете; внизу панель выбора */
:root {
  --bg: #FAFCFC;
  --card: #FFFFFF;
  --ink: #22363A;
  --muted: #5E7175;
  --line: #E2EAEB;
  --tag-bg: #EEF4F4;
  --tag-ink: #4A5E62;
  --accent: #7BB1E6;
  --accent-ink: #2F6AA8;
  --on-accent: #1B2C30;
  --on-strong: #1B2C30;
  --shadow: 0 14px 34px rgba(34, 54, 58, 0.16);
  --scrim: rgba(20, 35, 38, 0.4);
  --c1-tint: #FFF1D9; --c1-strong: #F0B24E;
  --c2-tint: #DFF4E6; --c2-strong: #6CC79B;
  --c3-tint: #DDEBFB; --c3-strong: #7BB1E6;
  --c4-tint: #FBE1EE; --c4-strong: #EE9EC2;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151F29; --card: #1C2833; --ink: #E8EFF5; --muted: #A4B4C3; --line: #2C3B49;
    --tag-bg: #263646; --tag-ink: #BCCAD6; --accent: #6CC1C8; --accent-ink: #6CC1C8; --on-accent: #0F1B1D; --on-strong: #0F1B1D;
    --shadow: 0 14px 34px rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.55);
    --c1-tint: #3A3022; --c1-strong: #F0BA66;
    --c2-tint: #1F392D; --c2-strong: #7AD2A6;
    --c3-tint: #1E3147; --c3-strong: #8DBDEB;
    --c4-tint: #402531; --c4-strong: #F0A6C5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151F29; --card: #1C2833; --ink: #E8EFF5; --muted: #A4B4C3; --line: #2C3B49;
  --tag-bg: #263646; --tag-ink: #BCCAD6; --accent: #6CC1C8; --accent-ink: #6CC1C8; --on-accent: #0F1B1D; --on-strong: #0F1B1D;
  --shadow: 0 14px 34px rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.55);
  --c1-tint: #3A3022; --c1-strong: #F0BA66;
  --c2-tint: #1F392D; --c2-strong: #7AD2A6;
  --c3-tint: #1E3147; --c3-strong: #8DBDEB;
  --c4-tint: #402531; --c4-strong: #F0A6C5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 0 130px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
.wrap { max-width: 640px; margin: 0 auto; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* верхняя панель */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.topbar-in { max-width: 640px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.langs { position: relative; min-width: 0; }
.seg { display: flex; gap: 6px; }
.lg {
  appearance: none; font: inherit; color: var(--ink); cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; height: 36px;
  font-size: 0.875rem; font-weight: 500; padding: 0 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  transition: background 0.15s, border-color 0.15s;
}
.lg:hover { border-color: var(--c3-strong); }
.lg[aria-pressed="true"], .lg[aria-expanded="true"] { background: var(--c3-tint); border-color: var(--c3-strong); }
.flag { display: block; flex: none; width: 24px; height: 16px; border-radius: 3px; outline: 1px solid rgba(128, 128, 128, 0.3); outline-offset: -1px; }
.lg.more { padding: 0 12px; }

.pop {
  position: absolute; top: calc(100% + 10px); left: 0;
  width: min(300px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 14px 6px 6px; transform-origin: var(--ox, 40px) 0;
  transform: scale(0.85); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform 0.18s ease, opacity 0.18s ease, visibility 0s 0.18s;
}
.pop.open { transform: none; opacity: 1; visibility: visible; pointer-events: auto; transition: transform 0.18s ease, opacity 0.18s ease; }
.pop-t { margin: 0 0 8px; padding-inline: 10px; font-size: 0.9375rem; color: var(--muted); }
.pop-list { list-style: none; margin: 0; padding: 0; max-height: min(320px, 50vh); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.opt {
  appearance: none; font: inherit; color: inherit; cursor: pointer; width: 100%; text-align: start;
  display: flex; align-items: center; gap: 12px; padding: 10px 10px; border: 0; border-radius: 10px; background: transparent; font-size: 1rem;
}
.opt:hover { background: var(--tag-bg); }
.opt[aria-pressed="true"] { background: var(--c3-tint); font-weight: 600; }
.opt .flag { width: 30px; height: 20px; border-radius: 4px; }
.opt .nm { flex: 1; min-width: 0; }
.opt .ck { color: transparent; flex: none; }
.opt[aria-pressed="true"] .ck { color: var(--accent-ink); }

.tbtn {
  appearance: none; flex: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; color: var(--ink);
  background: var(--card); border: none;
  transition: background 0.15s;
}
.tbtn:hover { background: var(--c1-tint); }
.tbtn:active { background: var(--c1-tint); }
.tbtn { outline: none; -webkit-tap-highlight-color: transparent; }
.tbtn:hover, .tbtn:active, .tbtn:focus, .tbtn:focus-visible { outline: none; border: none; box-shadow: none; }
.tbtn .sun { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tbtn .sun { display: block; }
  :root:not([data-theme="light"]) .tbtn .moon { display: none; }
}
:root[data-theme="dark"] .tbtn .sun { display: block; }
:root[data-theme="dark"] .tbtn .moon { display: none; }

/* шапка */
header.hero {
  display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px;
  margin-top: 20px; padding: 22px 20px 22px;
  border: 1px solid var(--line); border-radius: 24px;
  background: var(--card);
}
.hero-title { min-width: 0; }
.hero .lead { grid-column: 1 / -1; margin-top: 12px; }
.emblem { position: relative; width: 88px; height: 88px; border-radius: 50%; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.emblem-img { display: block; width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.emblem-fb { display: none; width: 100%; height: 100%; }
.emblem.noimg { background: var(--card) !important; }
.emblem-dark { display: none; padding: 0; object-fit: cover; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .emblem { background: #155C9E; }
  :root:not([data-theme="light"]) .emblem-light { display: none; }
  :root:not([data-theme="light"]) .emblem-dark { display: block; }
}
:root[data-theme="dark"] .emblem { background: #155C9E; }
:root[data-theme="dark"] .emblem-light { display: none; }
:root[data-theme="dark"] .emblem-dark { display: block; }
.emblem.nodark .emblem-dark { display: none !important; }
.emblem.nodark .emblem-light { display: block !important; }
.emblem.noimg .emblem-img { display: none !important; }
.emblem.noimg .emblem-fb { display: block; }
.em-bg { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.em-sun { fill: var(--c1-strong); }
.em-w { fill: none; stroke-width: 3.4; stroke-linecap: round; }
.em-w1 { stroke: var(--c3-strong); }
.em-w2 { stroke: var(--c2-strong); }
.em-w3 { stroke: var(--c4-strong); }
.eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 6px; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(2.5rem, 12.5vw, 3.25rem); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.stripe { display: flex; gap: 4px; margin: 16px 0; }
.stripe i { display: block; height: 4px; width: 30px; border-radius: 2px; }
.stripe i:nth-child(1) { background: var(--c1-strong); }
.stripe i:nth-child(2) { background: var(--c2-strong); }
.stripe i:nth-child(3) { background: var(--c3-strong); }
.stripe i:nth-child(4) { background: var(--c4-strong); }
.lead { margin: 0; color: var(--muted); font-size: 0.9375rem; max-width: 52ch; }

/* разделы */
section { padding-top: 32px; }
.sec-head { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 14px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.sec-en { font-size: 0.9375rem; color: var(--muted); }
.pill { margin-inline-start: auto; font-size: 0.75rem; font-weight: 500; background: var(--tint); color: var(--ink); padding: 3px 11px; border-radius: 999px; }

.dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card {
  appearance: none; width: 100%; min-width: 0; text-align: start; font: inherit; color: inherit;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.card:hover { border-color: var(--strong); }
.card[aria-pressed="true"] { background: var(--tint); border-color: var(--strong); }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.name { font-weight: 600; font-size: 1.0625rem; line-height: 1.35; }
.en { font-weight: 400; color: var(--muted); }
.desc { font-size: 0.9375rem; color: var(--muted); max-width: 60ch; }
.bdg {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 28px; height: 18px; padding: 0 8px; margin-inline-end: 8px; border-radius: 999px;
  font-size: 0.6875rem; font-weight: 600; line-height: 1; letter-spacing: 0.02em; vertical-align: 0.1em;
  color: var(--on-strong); background: var(--bf);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--bf) 26%, transparent);
}
.bdg-v { --bf: var(--c2-strong); }
.bdg-n { --bf: var(--c1-strong); }
.bdg-s { --bf: var(--accent); color: var(--on-accent); }
.mark { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; transition: background 0.15s, border-color 0.15s; }
.card:hover .mark { border-color: var(--strong); }
.card[aria-pressed="true"] .mark { background: var(--strong); border-color: var(--strong); color: var(--on-strong); }

.sub { margin-top: 6px; background: var(--tint); border-radius: 14px; padding: 12px; }
.sub-title { margin: 0 0 10px; font-size: 0.875rem; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.chip {
  appearance: none; font: inherit; color: inherit; text-align: start; min-width: 0;
  background: var(--card); border: 1.5px solid transparent; border-radius: 10px; padding: 9px 12px;
  display: flex; flex-direction: column; gap: 2px; cursor: pointer;
}
.chip .n { font-size: 0.9375rem; font-weight: 500; }
.chip .h { font-size: 0.8125rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.chip[aria-pressed="true"] .en, .chip[aria-pressed="true"] .h { color: var(--on-strong); opacity: 0.85; }
.chip:disabled { opacity: 0.45; cursor: not-allowed; }

/* пометки */
.menutag {
  margin: 14px auto 0; width: fit-content; max-width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 10px 34px 10px; text-align: center;
  box-shadow: 0 8px 22px rgba(34, 54, 58, 0.10);
}
.menutag .menutag-t {
  margin: 0; font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 8.5vw, 2.6rem); line-height: 1; letter-spacing: 0.01em;
}
.menutag .stripe { justify-content: center; margin: 10px 0 0; }

.notes { margin: 14px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.notes h2 { font-size: 1.5rem; margin-bottom: 12px; }
.legend { display: grid; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; font-size: 0.9375rem; }
.legend li { display: flex; gap: 12px; align-items: flex-start; padding-inline-start: 2px; }
.legend .bdg { margin-inline-end: 0; margin-top: 2px; vertical-align: baseline; }
.legend li span:last-child { min-width: 0; padding-top: 1px; }
.notes p { margin: 0 0 8px; font-size: 0.875rem; color: var(--muted); }
.notes p:last-child { margin-bottom: 0; }

/* нижняя панель */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line); padding-top: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dots { display: flex; gap: 5px; flex: none; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--strong); transition: background 0.15s; }
.dots i.on { background: var(--strong); }
.status { font-size: 0.875rem; font-weight: 500; }
.btn { appearance: none; font: inherit; font-weight: 600; font-size: 0.9375rem; white-space: nowrap; cursor: pointer; border: 1.5px solid var(--accent); border-radius: 999px; padding: 9px 18px; background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }

/* лист с выбором */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding-top: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 1.75rem; }
.state { margin: 14px 0 0; border-radius: 12px; padding: 12px 14px; font-size: 0.9375rem; font-weight: 500; background: var(--c1-tint); }
.state.ok { background: var(--c2-tint); }
.order { list-style: none; margin: 12px 0 0; padding: 0; }
.order li { padding: 14px 0; border-top: 1px solid var(--line); }
.order p { margin: 0; }
.order .cat { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.order .cat i { width: 10px; height: 10px; border-radius: 50%; background: var(--strong); }
.order .ru { font-size: 1.125rem; font-weight: 600; margin-top: 4px; }
.order .enl { font-size: 1rem; color: var(--muted); }
.order .extra { font-size: 0.9375rem; margin-top: 6px; }
.order .none { color: var(--muted); font-size: 0.9375rem; margin-top: 4px; }
.sheet-foot { margin-top: 8px; display: flex; justify-content: flex-start; }
</style>

</head>
<body>
<div class="topbar" dir="ltr">
  <div class="topbar-in">
    <div class="langs" id="langs">
      <div class="seg" role="group" aria-label="Language" id="seg"></div>
      <div class="pop" id="pop" role="dialog" aria-label="Different Language">
        <p class="pop-t">Different Language</p>
        <ul class="pop-list" id="popList"></ul>
      </div>
    </div>
    <button type="button" class="tbtn" id="theme" aria-label="Theme" title="Theme">
      <svg class="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <div class="hero-title">
      <p class="eyebrow">Beach Bar</p>
      <h1>The Palms</h1>

    try {
      var s = JSON.parse(fetchStore(KEY) || 'null');
      if (!s) return;
      CATS.forEach(function (c) { var id = s.sel && s.sel[c.id]; if (id && catOf[id] === c.id) sel[c.id] = id; });
      Object.keys(s.opts || {}).forEach(function (id) {
        var d = byId[id];
        if (!d || !d.opt || !Array.isArray(s.opts[id]) || sel[catOf[id]] !== id) return;
        opts[id] = s.opts[id].filter(function (i) { return Number.isInteger(i) && i >= 0 && i < d.opt.items.length; }).slice(0, d.opt.max);
      });
    } catch (e) {}
    var sl = fetchStore(LKEY);
    if (sl && LMAP[sl]) lang = sl;
    var st = fetchStore(TKEY);
    if (st === 'light' || st === 'dark') root.setAttribute('data-theme', st);
  }

  var $ = function (id) { return document.getElementById(id); };
  var menuEl = $('menu'), dotsEl = $('dots'), statusEl = $('status'), backdrop = $('backdrop');
  var stateEl = $('state'), orderEl = $('order'), openBtn = $('open'), closeBtn = $('close'), resetBtn = $('reset');
  var seg = $('seg'), pop = $('pop'), popList = $('popList');

  dotsEl.innerHTML = CATS.map(function (c, i) { return '<i style="' + cv(i + 1) + '"></i>'; }).join('');

  /* верхняя панель: языки */
  function renderLangBar() {
    var other = MAIN.indexOf(lang) === -1;
    seg.innerHTML = MAIN.map(function (c) {
      var l = LMAP[c];
      return '<button type="button" class="lg" data-lang="' + c + '" aria-pressed="' + (lang === c) + '">' + F(l[0]) + l[3] + '</button>';
    }).join('') + '<button type="button" class="lg more" id="more" aria-haspopup="dialog" aria-expanded="' + pop.classList.contains('open') +
      '" aria-label="Different Language">' + (other ? F(lang) + LMAP[lang][3] : DOTS) + '</button>';
    popList.querySelectorAll('.opt').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
  }
  popList.innerHTML = LANGS.map(function (l) {
    return '<li><button type="button" class="opt" data-lang="' + l[0] + '" aria-pressed="false">' + F(l[0]) + '<span class="nm">' + l[2] + '</span><span class="ck">' + CHECK + '</span></button></li>';
  }).join('');

  function setPop(open) {
    if (open) {
      var more = $('more');
      if (more) $('langs').style.setProperty('--ox', (more.offsetLeft + more.offsetWidth / 2) + 'px'), pop.style.setProperty('--ox', (more.offsetLeft + more.offsetWidth / 2) + 'px');
    }
    pop.classList.toggle('open', open);
    var m = $('more');
    if (m) m.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      var cur = popList.querySelector('[aria-pressed="true"]');
      if (cur) popList.scrollTop = Math.max(0, cur.parentNode.offsetTop - 80);
    }
  }

  function setLang(c) {
    if (!LMAP[c]) return;
    lang = c;
    store(LKEY, c);
    applyStatic();
    build();
    renderLangBar();
    update();
  }

  /* тема */
  function effective() {
    var t = root.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  $('theme').addEventListener('click', function () {
    var n = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', n);
    store(TKEY, n);
  });

  /* тексты */
  function applyStatic() {
    root.lang = lang;
    root.dir = RTL.indexOf(lang) !== -1 ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = T(+el.getAttribute('data-k')); });
    $('theme').setAttribute('aria-label', T(30));
    $('theme').setAttribute('title', T(30));
    resetBtn.textContent = T(13);
  }

  function build() {
    menuEl.innerHTML = CATS.map(function (c, i) {
      var dishes = c.dishes.map(function (d) {
        var bl = d.tags ? { 27: 'S', 28: 'V', 29: 'N' }[d.tags[0]] : '';
        var badge = bl ? '<span class="bdg bdg-' + bl.toLowerCase() + '" role="img" aria-label="' + esc(T(d.tags[0])) + '" title="' + esc(T(d.tags[0])) + '">' + bl + '</span>' : '';
        var sub = '';
        if (d.opt) {
          sub = '<div class="sub" hidden><p class="sub-title"><span>' + esc(T(d.opt.label)) + '</span><span class="count"></span></p><div class="chips">' +
            d.opt.items.map(function (it, k) {
              return '<button type="button" class="chip" aria-pressed="false" data-opt="' + d.id + ':' + k + '"><span class="n">' + nm(it[0]) + '</span>' + (it[1] ? '<span class="h">' + esc(T(it[1])) + '</span>' : '') + '</button>';
            }).join('') + '</div></div>';
        }
        return '<li data-dish="' + d.id + '"><button type="button" class="card" aria-pressed="false" data-pick="' + d.id + '"><span class="info"><span class="name">' + badge + nm(d.n) + '</span>' +
          (d.d ? '<span class="desc">' + esc(T(d.d)) + '</span>' : '') + '</span><span class="mark">' + CHECK + '</span></button>' + sub + '</li>';
      }).join('');
      return '<section id="' + c.id + '" style="' + cv(i + 1) + '"><div class="sec-head"><h2>' + esc(T(c.sec)) + '</h2>' +
        (lang !== 'en' ? '<span class="sec-en">' + esc(E(c.sec)) + '</span>' : '') + '<span class="pill">' + esc(T(5)) + '</span></div><ul class="dishes">' + dishes + '</ul></section>';
    }).join('');
  }

  /* выбор */
  function summary() {
    var missing = [], pending = [], n = 0;
    CATS.forEach(function (c) {
      var id = sel[c.id];
      if (!id) { missing.push(T(c.sec)); return; }
      n++;
      var d = byId[id];
      if (d.opt && (opts[id] || []).length < d.opt.max) pending.push(T(d.n));
    });
    return { n: n, missing: missing, pending: pending };
  }

  function renderSheet() {
    var s = summary(), ok = !s.missing.length && !s.pending.length;
    stateEl.textContent = s.missing.length ? T(15).replace('{list}', s.missing.join(', ')) :
      s.pending.length ? T(16).replace('{list}', s.pending.join(', ')) : T(17);
    stateEl.classList.toggle('ok', ok);
    orderEl.innerHTML = CATS.map(function (c, i) {
      var head = '<span class="cat" style="' + cv(i + 1) + '"><i></i>' + esc(T(c.sec)) + '</span>';
      var id = sel[c.id];
      if (!id) return '<li>' + head + '<p class="none">' + esc(T(18)) + '</p></li>';
      var d = byId[id], extra = '';
      if (d.opt) {
        var arr = (opts[id] || []).map(function (k) { return d.opt.items[k][0]; });
        extra = arr.length ? '<p class="extra">' + arr.map(nm).join(', ') + '</p>' : '<p class="none">' + esc(T(19)) + '</p>';
      }
      return '<li>' + head + '<p class="ru">' + esc(T(d.n)) + '</p>' + (lang !== 'en' ? '<p class="enl">' + esc(E(d.n)) + '</p>' : '') + extra + '</li>';
    }).join('');
  }

  function update() {
    CATS.forEach(function (c) {
      c.dishes.forEach(function (d) {
        var on = sel[c.id] === d.id;
        var li = menuEl.querySelector('[data-dish="' + d.id + '"]');
        li.querySelector('.card').setAttribute('aria-pressed', on ? 'true' : 'false');
        if (d.opt) {
          li.querySelector('.sub').hidden = !on;
          var arr = opts[d.id] || [];
          li.querySelectorAll('.chip').forEach(function (ch, k) {
            var p = arr.indexOf(k) !== -1;
            ch.setAttribute('aria-pressed', p ? 'true' : 'false');
            ch.disabled = !p && d.opt.max > 1 && arr.length >= d.opt.max;
          });
          li.querySelector('.count').textContent = d.opt.max > 1 ? arr.length + ' / ' + d.opt.max : '';
        }
      });
    });
    var s = summary();
    Array.prototype.forEach.call(dotsEl.children, function (dot, i) { dot.classList.toggle('on', !!sel[CATS[i].id]); });
    statusEl.textContent = s.n < CATS.length ? T(8).replace('{n}', s.n).replace('{t}', CATS.length) : s.pending.length ? T(9) : T(10);
    if (!backdrop.hidden) renderSheet();
  }

  function togglePick(id) {
    var cat = catOf[id];
    if (sel[cat] === id) { sel[cat] = null; delete opts[id]; }
    else { if (sel[cat]) delete opts[sel[cat]]; sel[cat] = id; }
    save(); update();
  }
  function toggleOpt(id, i) {
    var max = byId[id].opt.max, arr = (opts[id] || []).slice(), at = arr.indexOf(i);
    if (max === 1) arr = at !== -1 ? [] : [i];
    else if (at !== -1) arr.splice(at, 1);
    else if (arr.length < max) arr.push(i);
    opts[id] = arr;
    save(); update();
  }

  menuEl.addEventListener('click', function (e) {
    var p = e.target.closest('[data-pick]');
    if (p) { togglePick(p.getAttribute('data-pick')); return; }
    var o = e.target.closest('[data-opt]');
    if (o) { var x = o.getAttribute('data-opt').split(':'); toggleOpt(x[0], parseInt(x[1], 10)); }
  });

  seg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'more') { setPop(!pop.classList.contains('open')); return; }
    setPop(false);
    setLang(b.getAttribute('data-lang'));
  });
  popList.addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]');
    if (!b) return;
    setPop(false);
    setLang(b.getAttribute('data-lang'));
  });
  document.addEventListener('click', function (e) {
    if (pop.classList.contains('open') && !e.target.closest('#langs')) setPop(false);
  });

  function openSheet() { renderSheet(); backdrop.hidden = false; document.body.style.overflow = 'hidden'; closeBtn.focus(); }
  function closeSheet() { backdrop.hidden = true; document.body.style.overflow = ''; openBtn.focus(); }
  openBtn.addEventListener('click', openSheet);
  closeBtn.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!backdrop.hidden) closeSheet();
    else if (pop.classList.contains('open')) { setPop(false); var m = $('more'); if (m) m.focus(); }
  });

  var armed = false, timer = null;
  function disarm() { armed = false; clearTimeout(timer); resetBtn.textContent = T(13); }
  resetBtn.addEventListener('click', function () {
    if (!armed) { armed = true; resetBtn.textContent = T(14); timer = setTimeout(disarm, 3000); return; }
    disarm();
    CATS.forEach(function (c) { sel[c.id] = null; });
    Object.keys(opts).forEach(function (k) { delete opts[k]; });
    save(); update();
  });

  load();
  applyStatic();
  build();
  renderLangBar();
  update();
  /* логотипы лежат рядом с файлом; если светлого нет, показывается запасной значок, если тёмного нет, берётся светлый */
  (function () {
    var light = document.querySelector('.emblem-light'), dark = document.querySelector('.emblem-dark');
    if (!light || !dark) return;
    var box = light.parentNode;
    function watch(im, cls) {
      function bad() { box.classList.add(cls); }
      if (im.complete && !im.naturalWidth) bad(); else im.addEventListener('error', bad);
    }
    watch(light, 'noimg');
    watch(dark, 'nodark');
  })();
})();
</script>
</body>
</html>
